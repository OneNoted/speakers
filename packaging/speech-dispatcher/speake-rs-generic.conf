# speake-rs module for Speech Dispatcher via sd_generic
# Install to: ~/.config/speech-dispatcher/modules/speake-rs-generic.conf
# Note: speech-dispatcher may run with a minimal PATH, so we force cargo bin path.
# This module routes symbolic voices (MALE1/FEMALE1/etc.) to speake-rs.
# Any custom cloned profile mapping is configured by the user in ~/.config/speake-rs/config.toml.

Debug 0

GenericExecuteSynth "printf %s '$DATA' | /usr/bin/env PATH=$HOME/.cargo/bin:/usr/local/bin:/usr/bin speake-rs spd-synth --language '$LANGUAGE' --voice '$VOICE' --rate '$RATE' --pitch '$PITCH' --playback-command '$PLAY_COMMAND' >/dev/null 2>>$TMPDIR/speake-rs-spd-errors.log"

GenericCmdDependency "/usr/bin/env"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Optional mapping examples for symbolic voices:
# AddVoice "en" "MALE1"   "MALE1"
# AddVoice "en" "FEMALE1" "FEMALE1"
# AddVoice "en" "MALE2"   "MALE2"

AddVoice "en" "MALE1" "MALE1"
AddVoice "en" "MALE2" "MALE2"
AddVoice "en" "MALE3" "MALE3"
AddVoice "en" "FEMALE1" "FEMALE1"
AddVoice "en" "FEMALE2" "FEMALE2"
AddVoice "en" "FEMALE3" "FEMALE3"
AddVoice "en" "CHILD_MALE" "CHILD_MALE"
AddVoice "en" "CHILD_FEMALE" "CHILD_FEMALE"

DefaultVoice "MALE1"
